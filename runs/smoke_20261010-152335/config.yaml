experiment:
  name: smoke
  strategy: A
  seed: 0
  output_dir: runs
data:
  data_dir: data/gold_standard_data
  max_protein_length: 256
  batch_size: 16
  mask_prob: 0.15
  augmentation_percent: 0.0
  num_workers: 2
model:
  architecture: transformer
  transformer:
    d_model: 256
    n_layers: 4
    n_heads: 8
    d_ff: null
    dropout: 0.1
    attention_dropout: 0.0
    rope_base: 10000.0
    max_len: 2048
heads:
  classification:
    pooling: pair
    hidden_dims:
    - 256
    activations: gelu
    dropout: 0.1
    norm: false
  mlm:
    hidden_dims: null
    activations: gelu
    dropout: 0.0
    norm: true
    tie_embedding: true
training:
  device: auto
  precision: fp32
  classification:
    epochs: 20
    lr: 0.0003
    weight_decay: 0.01
    warmup_ratio: 0.05
    grad_clip: 1.0
    grad_accumulation: 1
    early_stopping_patience: 3
    freeze_encoder: false
    encoder_lr_scale: 1.0
  mlm:
    epochs: 10
    lr: 0.0005
    weight_decay: 0.01
    warmup_ratio: 0.05
    grad_clip: 1.0
    grad_accumulation: 1
    early_stopping_patience: 2
logging:
  tensorboard: true
  launch_tensorboard: true
  tensorboard_port: 6006
  log_every_steps: 50
