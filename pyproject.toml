[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppi-lm"
version = "0.1.0"
description = "From-scratch Mamba, Transformer, BiLSTM and CNN protein language models for PPI prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "scikit-learn", "tqdm"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # erreurs, imports triés, syntaxe moderne, bugs courants

[tool.pytest.ini_options]
testpaths = ["tests"]